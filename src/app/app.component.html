<div class="min-h-screen bg-[#FAF8F3] text-[#26332F] flex flex-col selection:bg-[#AFCFC0] selection:text-[#0E4543]">
  <app-navbar
    [store]="store"
    (openWhatsApp)="handleOpenWhatsApp()"
  ></app-navbar>

  <main class="flex-1">
    <app-hero
      [store]="store"
      (openWhatsApp)="handleOpenWhatsApp()"
    ></app-hero>

    <app-intro-section></app-intro-section>
    <app-editorial-edits (selectCategory)="handleSelectCategoryFromEdits($event)"></app-editorial-edits>

    <app-featured-looks
      [looks]="looks"
      [selectedCategoryFilter]="selectedCategoryFilter"
      (selectCategoryFilter)="selectedCategoryFilter = $event"
      (openLookModal)="activeLookModal = $event"
      (enquireWhatsApp)="handleOpenWhatsApp($event.enquiryMessage, $event)"
    ></app-featured-looks>

    <app-whatsapp-section
      [store]="store"
      (openWhatsApp)="handleOpenWhatsApp()"
    ></app-whatsapp-section>

    <app-why-pehnava [items]="whyPehnavaItems"></app-why-pehnava>
    <app-customer-reviews [reviews]="reviews"></app-customer-reviews>
    <app-instagram-section [posts]="instagramPosts" [store]="store"></app-instagram-section>
    <app-about-section [store]="store"></app-about-section>
    <app-visit-us [store]="store" (openWhatsApp)="handleOpenWhatsApp()"></app-visit-us>
  </main>

  <app-footer
    [store]="store"
    (openWhatsApp)="handleOpenWhatsApp()"
  ></app-footer>

  <app-floating-whatsapp (openWhatsApp)="handleOpenWhatsApp()"></app-floating-whatsapp>

  <app-whatsapp-modal
    [isOpen]="isWhatsAppModalOpen"
    [initialMessage]="whatsAppCustomMessage"
    [store]="store"
    (close)="handleCloseWhatsAppModal()"
  ></app-whatsapp-modal>

  <app-look-modal
    [look]="activeLookModal"
    (close)="handleCloseLookModal()"
    (enquire)="handleEnquireFromLookModal($event)"
  ></app-look-modal>

  <script type="application/ld+json" [textContent]="seoSchema"></script>
</div>
